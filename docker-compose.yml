services:
  db:
    image: pgvector/pgvector:pg16
    container_name: traceguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceguard}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceguard} -d ${POSTGRES_DB:-traceguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
